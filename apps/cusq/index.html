<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cusq</title>
    <link rel="icon" type="image/svg+xml" href="/src-tauri/icons/icon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar" id="toolbar">
      <div class="toolbar-inner">
        <div class="tb-group tb-left">

        </div>
        <div class="tb-center">
          <button class="tb-find needs-doc" id="search-btn" hidden title="Search (Ctrl+F)" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="tb-search-icon"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" /></svg>
            <span class="tb-stats" id="stats" hidden></span>
          </button>
          <div class="tb-search" id="search" role="search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="tb-search-icon"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" /></svg>
            <input id="search-input" type="text" placeholder="Search" aria-label="Search in document" spellcheck="false" autocomplete="off" />
            <span class="tb-search-count" id="search-count" aria-live="polite"></span>
            <button class="tb-btn small" id="search-prev" title="Previous match (↑, Shift+Enter)" aria-label="Previous match">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
            </button>
            <button class="tb-btn small" id="search-next" title="Next match (↓, Enter)" aria-label="Next match">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <button class="tb-btn small" id="search-close" title="Close (Esc)" aria-label="Close search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
            </button>
          </div>
        </div>
        <div class="tb-group tb-right">
          <div class="tb-part needs-doc" id="view-tools" hidden>
            <button class="tb-btn" id="header-btn" title="First row is the header" aria-label="First row is the header" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" /><path d="M4 10h16M10 10v9" /></svg>
            </button>
            <button class="tb-btn" id="clear-btn" title="Clear filters and sorting" aria-label="Clear filters and sorting" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 8v5l-4 1v-6L4 5Z" /><path d="m17 16 4 4M21 16l-4 4" /></svg>
            </button>
          </div>
          <div class="tb-part" id="doc-tools" hidden>
            <button class="tb-btn" id="copy-btn" title="Copy to Clipboard" aria-label="Copy to Clipboard">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-copy">
                <rect x="8.5" y="8.5" width="11" height="11" rx="2" />
                <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
              </svg>
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-done"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
            </button>
          </div>
        </div>
      </div>
    </header>
    <div id="empty" class="empty">Drop CSV File Here</div>
    <div id="grid" hidden></div>
  </body>
</html>
