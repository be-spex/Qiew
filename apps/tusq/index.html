<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tusq</title>
    <link rel="icon" type="image/svg+xml" href="/src-tauri/icons/icon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar" id="toolbar">
      <div class="toolbar-inner">
        <div class="tb-group tb-left">
          <button class="tb-btn" id="reload-btn" hidden title="Reload (F5)" aria-label="Reload">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" /><path d="M19.5 4.5v4h-4" />
            </svg>
          </button>
        </div>
        <div class="tb-center">
          <span class="tb-stats" id="stats" hidden></span>
        </div>
        <div class="tb-group tb-right">
          <div class="tb-group" id="doc-tools" hidden>
          <button class="tb-btn" id="copy-btn" title="Copy to Clipboard (Source)" aria-label="Copy to Clipboard">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-copy">
              <rect x="8.5" y="8.5" width="11" height="11" rx="2" />
              <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
            </svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-done">
              <path d="m5 12.5 4.5 4.5L19 7.5" />
            </svg>
          </button>
          </div>
        </div>
      </div>
    </header>
    <div id="empty" class="empty">Drop TSX or JSX File Here</div>
    <iframe id="doc" title="Preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals" hidden></iframe>
  </body>
</html>
