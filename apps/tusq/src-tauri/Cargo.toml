[package]
name = "tusq"
version = "0.1.0"
description = "TSX/JSX viewer, read-only – by be-spex"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name
# (an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519).
name = "tusq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
qiew-frame = { path = "../../../crates/frame" }
tauri = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
notify = { workspace = true }
oxc = { version = "0.158", features = ["semantic", "transformer", "codegen"] }
percent-encoding = "2"
