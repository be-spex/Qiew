<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marq</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar" id="toolbar">
      <div class="toolbar-inner">
        <div class="tb-group tb-left">
          <button class="tb-btn" id="back-btn" title="Back (Alt+←)" aria-label="Back" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          </button>
        </div>
        <div class="tb-center">
          <span class="tb-stats" id="stats" hidden></span>
          <div class="tb-search" id="search" role="search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="tb-search-icon">
            <circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" />
          </svg>
          <input id="search-input" type="text" placeholder="Search" aria-label="Search in document" spellcheck="false" autocomplete="off" />
          <span class="tb-search-count" id="search-count" aria-live="polite"></span>
          <button class="tb-btn small" id="search-prev" title="Previous match (↑, Shift+Enter)" aria-label="Previous match">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
          </button>
          <button class="tb-btn small" id="search-next" title="Next match (↓, Enter)" aria-label="Next match">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <button class="tb-btn small" id="search-close" title="Close (Esc)" aria-label="Close search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
          </button>
          </div>
        </div>
        <div class="tb-group tb-right">
          <div class="tb-group" id="doc-tools" hidden>
          <button class="tb-btn" id="search-btn" title="Search (Ctrl+F)" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" />
            </svg>
          </button>
          <button class="tb-btn" id="copy-btn" title="Copy to Clipboard (Markdown)" aria-label="Copy to Clipboard">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-copy">
              <rect x="8.5" y="8.5" width="11" height="11" rx="2" />
              <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
            </svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-done">
              <path d="m5 12.5 4.5 4.5L19 7.5" />
            </svg>
          </button>
          </div>
          <span class="tb-sep" aria-hidden="true"></span>
          <div class="tb-menu">
            <button class="tb-btn" id="view-btn" title="Farbschema" aria-label="Farbschema" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.8-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.8-1.7h2.1A4.3 4.3 0 0 0 21 11c0-4.4-4-8-9-8Z" />
                <circle cx="7.5" cy="11" r="1.1" class="fill" />
                <circle cx="10" cy="7.2" r="1.1" class="fill" />
                <circle cx="14.6" cy="7.2" r="1.1" class="fill" />
              </svg>
            </button>
            <div class="tb-dropdown" id="view-menu" role="menu" hidden></div>
          </div>
        </div>
      </div>
    </header>
    <div id="empty" class="empty">Drop Markdown File Here</div>
    <article id="doc" class="markdown-body" hidden></article>
  </body>
</html>
