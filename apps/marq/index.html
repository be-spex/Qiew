<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marq</title>
    <link rel="icon" type="image/svg+xml" href="/src-tauri/icons/icon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar" id="toolbar">
      <div class="toolbar-inner">
        <div class="tb-group tb-left">
          <div class="tb-part">
            <button class="tb-btn" id="back-btn" title="Back (Alt+←)" aria-label="Back" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
            </button>
          </div>
        </div>
        <div class="tb-center">
          <button class="tb-find needs-doc" id="search-btn" hidden title="Search (Ctrl+F)" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="tb-search-icon"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" /></svg>
            <span class="tb-stats" id="stats" hidden></span>
          </button>
          <div class="tb-search" id="search" role="search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="tb-search-icon"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" /></svg>
            <input id="search-input" type="text" placeholder="Search" aria-label="Search in document" spellcheck="false" autocomplete="off" />
            <span class="tb-search-count" id="search-count" aria-live="polite"></span>
            <button class="tb-btn small" id="search-prev" title="Previous match (↑, Shift+Enter)" aria-label="Previous match">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
            </button>
            <button class="tb-btn small" id="search-next" title="Next match (↓, Enter)" aria-label="Next match">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <button class="tb-btn small" id="search-close" title="Close (Esc)" aria-label="Close search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
            </button>
          </div>
        </div>
        <div class="tb-group tb-right">
          <div class="tb-part needs-doc" id="view-tools" hidden>
            <button class="tb-btn" id="width-btn" title="Full width (Ctrl+Shift+B)" aria-label="Full width" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" /></svg>
            </button>
            <button class="tb-btn" id="outline-btn" title="Outline (Ctrl+Shift+O)" aria-label="Outline" aria-expanded="false" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2M10 6h10M7 12h2M13 12h7M10 18h2M16 18h4" /></svg>
            </button>
          </div>
          <div class="tb-part" id="doc-tools" hidden>
            <button class="tb-btn" id="copy-btn" title="Copy to Clipboard (Markdown)" aria-label="Copy to Clipboard">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-copy">
                <rect x="8.5" y="8.5" width="11" height="11" rx="2" />
                <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
              </svg>
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-done"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
            </button>
          </div>
        </div>
      </div>
    </header>
    <nav id="outline" class="outline" aria-label="Outline">
      <div class="outline-head">
        <span>Outline</span>
        <span class="outline-actions">
        <button class="tb-btn small" id="outline-pin" title="Pin" aria-label="Pin outline" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6ZM12 13v7" /></svg>
        </button>
        <button class="tb-btn small" id="outline-close" title="Close outline" aria-label="Close outline">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
        </button>
        </span>
      </div>
      <div class="outline-list" id="outline-list"></div>
    </nav>
    <div id="empty" class="empty">Drop Markdown File Here</div>
    <article id="doc" class="markdown-body" hidden></article>
  </body>
</html>
