[package]
name = "jayq"
version = "0.1.4"
description = "JSON viewer with jq filters, read-only – by be-spex"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name
# (an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519).
name = "jayq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
qiew-frame = { path = "../../../crates/frame" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
