<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jayq</title>
    <link rel="icon" type="image/svg+xml" href="/src-tauri/icons/icon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <section class="pane pane-doc" id="pane-doc">
    <h2 class="pane-title">JSON</h2>
    <header class="toolbar" id="toolbar">
      <div class="toolbar-inner">
        <div class="tb-group tb-left">
          <div class="tb-part split-only">
            <button class="tb-btn labeled" id="split-close-btn" title="Close the jq filter, back to the JSON view">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
              <span>Back to JSON</span>
            </button>
          </div>
        </div>
        <div class="tb-center">
          <button class="tb-find needs-doc" id="search-btn" hidden title="Search (Ctrl+F)" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="tb-search-icon"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" /></svg>
            <span class="tb-stats" id="stats" hidden></span>
          </button>
          <div class="tb-search" id="search" role="search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="tb-search-icon"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.4-4.4" /></svg>
            <input id="search-input" type="text" placeholder="Search" aria-label="Search in document" spellcheck="false" autocomplete="off" />
            <span class="tb-search-count" id="search-count" aria-live="polite"></span>
            <button class="tb-btn small" id="search-prev" title="Previous match (↑, Shift+Enter)" aria-label="Previous match">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
            </button>
            <button class="tb-btn small" id="search-next" title="Next match (↓, Enter)" aria-label="Next match">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <button class="tb-btn small" id="search-close" title="Close (Esc)" aria-label="Close search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
            </button>
          </div>
        </div>
        <div class="tb-group tb-right">
          <div class="tb-part" id="view-tools">
            <button class="tb-btn" id="split-btn" title="jq Filter (JSON · jq · Result)" aria-label="jq Filter" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14M5 12.5h14M5 19h1.5c4.5 0 3.5-6.5 8-6.5" /><circle class="fill" cx="5" cy="5.5" r="2.2" /><circle class="fill" cx="19" cy="5.5" r="2.2" /><circle class="fill" cx="5" cy="12.5" r="2.2" /><circle class="fill" cx="19" cy="12.5" r="2.2" /><circle class="fill" cx="5" cy="19" r="2.2" /></svg>
            </button>
          </div>
          <div class="tb-part" id="fold-tools">
            <button class="tb-btn" id="unfold-btn" title="Expand all" aria-label="Expand all">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5-5 5 5M7 15l5 5 5-5" /></svg>
            </button>
            <button class="tb-btn" id="fold-btn" title="Collapse all (keeps the root open)" aria-label="Collapse all">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 5 5 5-5M7 20l5-5 5 5" /></svg>
            </button>
          </div>
          <div class="tb-part" id="doc-tools" hidden>
            <button class="tb-btn" id="copy-btn" title="Copy to Clipboard (formatted JSON)" aria-label="Copy to Clipboard">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-copy">
                <rect x="8.5" y="8.5" width="11" height="11" rx="2" />
                <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
              </svg>
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-done"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
            </button>
          </div>
        </div>
      </div>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="empty" class="empty">Drop JSON File Here</div>
    <article id="doc" class="source" hidden></article>
    </section>

    <section class="pane pane-editor" id="pane-editor" hidden>
      <h2 class="pane-title">jq</h2>
      <header class="toolbar" id="editor-toolbar">
        <div class="toolbar-inner">
          <div class="tb-group tb-left"></div>
          <div class="tb-center"></div>
          <div class="tb-group tb-right">
            <div class="tb-part">
              <button class="tb-btn" id="editor-load-btn" title="Load jq File…" aria-label="Load jq File">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7v10.5A1.5 1.5 0 0 0 5 19h14a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 19 8h-7l-2-2.5H5A1.5 1.5 0 0 0 3.5 7Z" /></svg>
              </button>
            </div>
            <div class="tb-part">
              <button class="tb-btn run" id="run-btn" title="Run Filter (Ctrl+Enter)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5Z" class="fill" /></svg>
                <span>Run</span>
              </button>
            </div>
          </div>
        </div>
      </header>
      <textarea id="editor" class="editor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="jq filter"></textarea>
    </section>

    <section class="pane pane-result" id="pane-result" hidden>
      <h2 class="pane-title">Result</h2>
      <header class="toolbar" id="result-toolbar">
        <div class="toolbar-inner">
          <div class="tb-group tb-left"></div>
          <div class="tb-center"><span class="tb-stats" id="duration" aria-live="polite"></span></div>
          <div class="tb-group tb-right">
            <div class="tb-part">
              <button class="tb-btn" id="result-copy-btn" title="Copy Result to Clipboard" aria-label="Copy Result to Clipboard">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-copy">
                  <rect x="8.5" y="8.5" width="11" height="11" rx="2" />
                  <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-done"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
              </button>
              <button class="tb-btn" id="result-save-btn" title="Save Result…" aria-label="Save Result">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-copy"><path d="M12 4.5v10M7.5 10.5l4.5 4.5 4.5-4.5" /><path d="M5 15.5v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" /></svg>
                <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-done"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
              </button>
            </div>
          </div>
        </div>
      </header>
      <article id="result" class="source"></article>
    </section>
  </body>
</html>
