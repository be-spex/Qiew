name: Release

# Builds the .deb and the AppImage of one app on Ubuntu 24.04 (glibc 2.39:
# current Ubuntu, Mint, Debian and their relatives).
#
# A tag <app>-v<version> (e.g. xaq-v0.3.1) publishes them as a release and
# puts the AppImage updater's manifest as <app>.json into the release
# "updater", which is where the installed AppImages look for updates.
# workflow_dispatch only builds (artifacts, no release).
on:
  push:
    tags: ["marq-v*", "xaq-v*", "jayq-v*"]
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        type: choice
        options: [marq, xaq, jayq]
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Determine app and version
        id: app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            app=${GITHUB_REF_NAME%-v*}
          else
            app=${{ inputs.app }}
          fi
          conf=apps/$app/src-tauri/tauri.conf.json
          version=$(jq -r .version "$conf")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$app-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in $conf" >&2
            exit 1
          fi
          {
            echo "app=$app"
            echo "version=$version"
            echo "name=$(jq -r .productName "$conf")"
          } >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.app.outputs.app }}

      - run: npm ci

      - name: Build .deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # linuxdeploy's strip cannot read the .relr.dyn sections of Ubuntu 24.04 libraries
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri --workspace apps/${{ steps.app.outputs.app }} -- build --bundles deb,appimage

      - name: Collect artifacts
        env:
          APP: ${{ steps.app.outputs.app }}
          VERSION: ${{ steps.app.outputs.version }}
          NAME: ${{ steps.app.outputs.name }}
        run: |
          bundle=target/release/bundle
          mkdir -p dist-release
          # Debian naming convention: lowercase package name
          cp $bundle/deb/*.deb "dist-release/${APP}_${VERSION}_amd64.deb"
          image="${NAME}_${VERSION}_amd64.AppImage"
          cp $bundle/appimage/*.AppImage "dist-release/$image"
          cp $bundle/appimage/*.AppImage.sig "dist-release/$image.sig"
          jq -n --arg version "$VERSION" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg signature "$(cat "dist-release/$image.sig")" \
                --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$APP-v$VERSION/$image" \
                '{version: $version, pub_date: $date,
                  platforms: {"linux-x86_64": {signature: $signature, url: $url}}}' \
                > "dist-release/$APP.json"
          cd dist-release
          sha256sum *.deb *.AppImage > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app.outputs.app }}
          path: dist-release/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.app.outputs.name }} ${{ steps.app.outputs.version }}
          files: dist-release/*

      # The updater endpoint of each app is a fixed URL:
      # releases/download/updater/<app>.json
      - name: Point the AppImage updater to this release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.app.outputs.app }}
        run: |
          if ! gh release view updater -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create updater -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Updater manifests" \
              --notes "Not a release: holds <app>.json, the manifest each AppImage reads to find its newest version."
          fi
          gh release upload updater "dist-release/$APP.json" -R "$GITHUB_REPOSITORY" --clobber
